id: convertx
name: ConvertX
description: Self-hosted online file converter supporting over a thousand formats — documents, images, audio, video, e-books, and more
version: 0.10.0
category: utility
website: https://github.com/C4illin/ConvertX
repository: https://github.com/C4illin/ConvertX
featured: true

deployment:
  compose_file: app-compose/docker-compose.yml.tmpl
  ports:
    - host: 3000
      container: 3000
      protocol: tcp
      name: ui
  volumes:
    - name: convertx-data
      mount_path: /app/data
  restart_policy: unless-stopped

configuration:
  - name: http_port
    label: Web Port
    description: The port your app's web page opens on in your browser
    type: port
    default: 3000
    required: true
    env_var: PORT
    advanced: true
  - name: auto_delete_hours
    label: Auto-Delete After (hours)
    description: How long to keep converted files before automatically deleting them. Set to 0 to disable.
    type: number
    default: 24
    required: false
  - name: max_conversions
    label: Max Concurrent Conversions
    description: Maximum number of conversions running at the same time. Set to 0 for unlimited.
    type: number
    default: 0
    required: false
    env_var: MAX_CONVERT_PROCESS
    advanced: true


health_check:
  type: http
  endpoint: /healthcheck
  port: 3000
  interval: 30s
  timeout: 5s
  retries: 3

requirements:
  min_ram: "512M"
  min_cpu: 0.5
  min_disk: "1G"
  arch:
    - amd64
    - arm64

updates:
  strategy: notify
  backup_before_update: true
scripts:
  system:
    setup: scripts/system-setup
    repair: scripts/system-repair
    destructive_repair:
      script: scripts/system-destructive-repair
      description: Deletes all converted files, upload history, and the database. ConvertX starts fresh as if just installed — all conversion history is lost.

features:
  read_only: false
  no_uninstall: false
  experimental: false
  requires_root: false
  requires_gpu: false
  supported_os:
    - linux
  min_ram: 512
  min_cpu: 1
  access_model: external
  backup: supported
  update_behavior:
    automatic: false
    requires_downtime: true
    supports_rollback: true
  custom_domains: true
  resource_hints:
    single_instance: true
    privileged_required: false

id: open-webui
name: Open WebUI
description: A private AI chat assistant — talk to AI models that run on your own server, or connect to external AI services like OpenAI. Your conversations stay on your server, not on someone else's.
version: 0.6.5
category: ai
website: https://openwebui.com
repository: https://github.com/open-webui/open-webui
featured: true
access_model: internal

oidc_redirect_path: /oauth/oidc/callback

deployment:
  compose_file: app-compose/docker-compose.yml.tmpl
  ports:
    - host: 3000
      container: 8080
      protocol: tcp
      name: ui
  volumes:
    - name: webui-data
      mount_path: /app/backend/data
    - name: ollama-models
      mount_path: /root/.ollama
  restart_policy: unless-stopped

configuration:
  - name: http_port
    label: Web Port
    description: The web port your chat page opens on. You should not need to change this unless another app is already using the default.
    type: port
    default: 3000
    required: true
    advanced: true
  - name: webui_secret_key
    label: Security Key
    description: A long random password that keeps your chat login secure — automatically generated if left blank
    type: password
    required: false
    advanced: true
  - name: enable_ollama
    label: Local AI Models
    description: Bundle a local AI model runner so you can chat with AI models that run entirely on your own server. Turn this off if you want to connect to an external AI service instead, like OpenAI or another provider you already use.
    type: boolean
    default: true
    required: false

exposed_info:
  - name: webui_secret_key
    label: Security Key
    description: The secret key used to keep your chat login secure
    type: password
    group: credentials
    copyable: true
    revealable: true
    mask_by_default: true
    advanced: true

health_check:
  type: http
  endpoint: /health
  port: 3000
  interval: 30s
  timeout: 10s
  retries: 5

requirements:
  min_ram: "2G"
  min_cpu: 1
  min_disk: "10G"
  arch:
    - amd64
    - arm64

updates:
  strategy: notify
  backup_before_update: true

scripts:
  system:
    setup: scripts/system-setup
    repair: scripts/system-repair
    destructive_repair:
      script: scripts/system-destructive-repair
      description: Deletes all chat history, user accounts, settings, and downloaded AI models. Open WebUI starts over as if just installed — all conversations and customizations are wiped and cannot be recovered.
